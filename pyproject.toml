[build-system]
requires = ["setuptools>=61.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "prompt-engine"
version = "0.1.0"
description = "A reusable Python framework for managing and rendering LLM prompts with Pydantic and Jinja2."
readme = "README.md"
requires-python = ">=3.9"
authors = [
    { name = "Developer", email = "developer@example.com" }
]
license = { text = "MIT" }
dependencies = [
    "pydantic>=2.0.0",
    "Jinja2>=3.0.0",
    "PyYAML>=6.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=7.0.0",
    "pytest-mock",
]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
